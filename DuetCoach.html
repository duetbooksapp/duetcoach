<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DuetCoach — Sales Roleplay Practice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--pri:#534AB7;--grn:#1D9E75;--amb:#EF9F27;--red:#D94545;--dgrn:#0F6E56;
--bg:#f5f5f3;--card:#fff;--txt:#222;--muted:#666;--border:#ddd;
--ptint:#EEEDFE;--gtint:#F0FBF7;--atint:#FFFCF5;--rtint:#FEF2F2;
--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08)
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-tap-highlight-color:transparent}

/* Top Bar */
.topbar{background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar .brand{font-weight:700;font-size:17px;letter-spacing:-.3px}
.topbar .sub{font-size:11px;opacity:.75;margin-left:8px}
.topbar-right{font-size:11px;opacity:.8}

/* Tabs */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:42px;z-index:99;overflow-x:auto}
.tab{flex:1;text-align:center;padding:10px 6px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab.active{color:var(--pri);border-bottom-color:var(--pri)}
.tab-short{display:none}

/* Panels */
.panel{display:none;padding:16px;padding-bottom:80px;min-height:calc(100vh - 100px)}
.panel.active{display:block}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h3{font-size:14px;margin-bottom:10px;color:var(--pri)}

/* Stat Grid */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:center;border-top:3px solid var(--pri)}
.stat-card.grn{border-top-color:var(--grn)}
.stat-card.amb{border-top-color:var(--amb)}
.stat-card.red{border-top-color:var(--red)}
.stat-card .num{font-size:24px;font-weight:700;color:var(--txt)}
.stat-card .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.stat-card .sub{font-size:10px;color:var(--muted);margin-top:4px}

/* Badges */
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:600}
.badge-pri{background:var(--ptint);color:var(--pri)}
.badge-grn{background:var(--gtint);color:var(--grn)}
.badge-amb{background:var(--atint);color:var(--amb)}
.badge-red{background:var(--rtint);color:var(--red)}

/* Buttons */
.btn{display:inline-block;padding:8px 16px;border-radius:var(--radius);font-size:12px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-pri{background:var(--pri);color:#fff}
.btn-grn{background:var(--grn);color:#fff}
.btn-amb{background:var(--amb);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--pri);color:var(--pri)}
.btn-sm{padding:5px 10px;font-size:11px}

/* Pills / Filters */
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:5px 12px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--muted);background:var(--card);transition:all .15s}
.pill.active{border-color:var(--pri);color:var(--pri);background:var(--ptint)}
.pill.cat-annuity.active{border-color:var(--grn);color:var(--grn);background:var(--gtint)}
.pill.cat-life.active{border-color:var(--red);color:var(--red);background:var(--rtint)}
.pill.cat-iul.active{border-color:var(--amb);color:var(--amb);background:var(--atint)}
.pill.cat-banking.active{border-color:var(--pri);color:var(--pri);background:var(--ptint)}

/* Persona Cards */
.persona-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.persona-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.persona-card:hover{border-color:var(--pri)}
.persona-card .avatar{font-size:32px;margin-bottom:6px}
.persona-card .pname{font-weight:700;font-size:14px}
.persona-card .psit{font-size:11px;color:var(--muted);margin:4px 0 8px;line-height:1.4}
.persona-card .pmeta{display:flex;gap:6px;align-items:center}

/* Chat Interface */
.chat-wrapper{display:flex;flex-direction:column;height:calc(100vh - 160px)}
.phase-tracker{display:flex;gap:4px;align-items:center;padding:10px 0;justify-content:center}
.phase-step{display:flex;flex-direction:column;align-items:center;flex:1;max-width:120px}
.phase-dot{width:28px;height:28px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:background .3s}
.phase-dot.done{background:var(--grn)}
.phase-dot.current{background:var(--amb);animation:pulse 1.5s infinite}
.phase-lbl{font-size:8px;color:var(--muted);margin-top:3px;text-align:center;text-transform:uppercase;letter-spacing:.3px}
.phase-line{width:100%;height:2px;background:var(--border);flex:0 0 auto;margin:0 -2px}
.phase-line.done{background:var(--grn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.session-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:8px}
.timer{font-weight:700;font-size:13px;color:var(--pri);font-variant-numeric:tabular-nums}

.chat-container{flex:1;overflow-y:auto;padding:8px 0 70px;display:flex;flex-direction:column;gap:8px}
.chat-row{display:flex;align-items:flex-end;gap:8px}
.chat-row.client{justify-content:flex-start}
.chat-row.agent{justify-content:flex-end}
.chat-bubble{max-width:78%;padding:10px 14px;font-size:13px;line-height:1.5;border-radius:16px;word-wrap:break-word}
.chat-bubble.client-msg{background:var(--ptint);color:var(--txt);border-bottom-left-radius:4px}
.chat-bubble.agent-msg{background:var(--gtint);color:var(--txt);border-bottom-right-radius:4px}
.chat-persona-tag{font-size:9px;color:var(--muted);margin-bottom:2px;font-weight:600}
.typing-dots{display:flex;gap:4px;padding:10px 14px}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

.chat-input-bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);align-items:flex-end;position:fixed;bottom:0;left:0;right:0;background:var(--card);z-index:50;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.chat-input-bar textarea{flex:1;border:1.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:13px;font-family:inherit;resize:none;min-height:42px;max-height:120px;line-height:1.4}
.chat-input-bar textarea:focus{outline:none;border-color:var(--pri)}
.chat-input-bar .send-btn{background:var(--pri);color:#fff;border:none;border-radius:var(--radius);padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.chat-input-bar .send-btn:disabled{opacity:.4;cursor:default}
.end-btn{background:var(--red);color:#fff;border:none;border-radius:var(--radius);padding:10px 14px;font-weight:600;font-size:11px;cursor:pointer;white-space:nowrap}

/* Score Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:12px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal h2{font-size:18px;margin-bottom:16px;color:var(--pri)}
.score-row{margin-bottom:12px}
.score-label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px}
.score-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.score-fill{height:100%;border-radius:4px;transition:width .6s ease}
.score-total{text-align:center;margin:20px 0;padding:16px;background:var(--ptint);border-radius:var(--radius)}
.score-total .big{font-size:36px;font-weight:700;color:var(--pri)}
.score-total .lbl{font-size:11px;color:var(--muted)}
.coaching-tip{background:var(--gtint);border-radius:var(--radius);padding:12px;margin-top:12px;font-size:12px;line-height:1.5}
.coaching-tip b{color:var(--grn)}

/* History */
.session-row{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:background .15s}
.session-row:hover{background:var(--ptint)}
.session-row .sr-top{display:flex;justify-content:space-between;align-items:center}
.session-row .sr-name{font-weight:700;font-size:13px}
.session-row .sr-date{font-size:10px;color:var(--muted)}
.session-row .sr-meta{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--muted)}
.session-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.session-detail.show{display:block}
.mini-transcript{max-height:200px;overflow-y:auto;font-size:11px;line-height:1.6;padding:8px;background:var(--bg);border-radius:var(--radius);margin-bottom:10px}
.mini-transcript .mt-client{color:var(--pri);font-weight:600}
.mini-transcript .mt-agent{color:var(--grn);font-weight:600}

/* Stats */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar-fill{width:100%;max-width:28px;border-radius:4px 4px 0 0;transition:height .3s;min-height:2px}
.bar-date{font-size:8px;color:var(--muted);margin-top:4px;transform:rotate(-45deg);white-space:nowrap}
.bar-score{font-size:8px;font-weight:700;margin-bottom:2px}

.streak-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.streak-day{width:100%;aspect-ratio:1;border-radius:3px;background:var(--bg)}
.streak-day.active{background:var(--grn)}
.streak-day.today{border:2px solid var(--pri)}
.day-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:2px}
.day-labels span{font-size:8px;color:var(--muted);text-align:center}

/* Settings */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--pri)}
.api-status{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px}
.api-status.ok{background:var(--grn)}
.api-status.err{background:var(--red)}
.api-status.unk{background:var(--border)}

/* Toast */
.toast-container{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--txt);color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:500;animation:fadeInUp .3s ease;white-space:nowrap}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Mobile Nav */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav-inner{display:flex}
.mnav{flex:1;text-align:center;padding:8px 4px 6px;font-size:9px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none}
.mnav.active{color:var(--pri)}
.mnav-icon{font-size:18px;display:block;margin-bottom:1px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--border)}
td{padding:8px;border-bottom:1px solid var(--border)}

/* Responsive */
@media(max-width:768px){
 .tabs{display:none}
 .mobile-nav{display:block}
 .panel{padding:12px;padding-bottom:90px}
 .stat-grid{grid-template-columns:repeat(2,1fr)}
 .persona-grid{grid-template-columns:1fr}
 .chat-bubble{max-width:88%}
 .chat-wrapper{height:calc(100vh - 130px)}
 body.in-session .mobile-nav{display:none}
 body.in-session .panel{padding-bottom:70px}
 .topbar .sub{display:none}
}
@media(max-width:480px){
 .stat-grid{grid-template-columns:1fr 1fr}
 .chat-bubble{max-width:92%}
 .modal{padding:16px;margin:8px}
}
</style>
</head>
<body>

<div class="topbar">
 <div><span class="brand">DuetCoach</span><span class="sub">Sales Practice</span></div>
 <div class="topbar-right" id="streakDisplay"></div>
</div>

<div class="tabs">
 <div class="tab active" onclick="showTab(0)">Practice</div>
 <div class="tab" onclick="showTab(1)">History</div>
 <div class="tab" onclick="showTab(2)">Stats</div>
 <div class="tab" onclick="showTab(3)">Settings</div>
</div>

<div class="panel active" id="p0"></div>
<div class="panel" id="p1"></div>
<div class="panel" id="p2"></div>
<div class="panel" id="p3"></div>

<div class="mobile-nav">
 <div class="mobile-nav-inner">
  <button class="mnav active" onclick="showTab(0)"><span class="mnav-icon">&#x1F3AF;</span>Practice</button>
  <button class="mnav" onclick="showTab(1)"><span class="mnav-icon">&#x1F4CB;</span>History</button>
  <button class="mnav" onclick="showTab(2)"><span class="mnav-icon">&#x1F4CA;</span>Stats</button>
  <button class="mnav" onclick="showTab(3)"><span class="mnav-icon">&#x2699;&#xFE0F;</span>Settings</button>
 </div>
</div>

<div class="modal-overlay" id="scoreModal"><div class="modal" id="scoreModalContent"></div></div>
<div class="toast-container" id="toastContainer"></div>

<script>
// ── Utilities ──
function $1(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function showToast(msg,ms){var t=document.createElement('div');t.className='toast';t.textContent=msg;$1('#toastContainer').appendChild(t);setTimeout(function(){t.remove()},ms||3000)}
function fmt(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function pad2(n){return n<10?'0'+n:''+n}
function fmtTime(secs){return pad2(Math.floor(secs/60))+':'+pad2(secs%60)}
function fmtDate(d){var dt=new Date(d);return (dt.getMonth()+1)+'/'+dt.getDate()+'/'+dt.getFullYear()}
function fmtDateShort(d){var dt=new Date(d);return (dt.getMonth()+1)+'/'+dt.getDate()}

// ── Tab System ──
var currentTab=0;
function showTab(n){
 currentTab=n;
 $$('.panel').forEach(function(p,i){p.classList.toggle('active',i===n)});
 $$('.tab').forEach(function(t,i){t.classList.toggle('active',i===n)});
 $$('.mnav').forEach(function(m,i){m.classList.toggle('active',i===n)});
 if(n===0) renderPractice();
 if(n===1) renderHistory();
 if(n===2) renderStats();
 if(n===3) renderSettings();
}

// ── localStorage ──
function loadJSON(key,def){try{var v=localStorage.getItem(key);return v?JSON.parse(v):def}catch(e){return def}}
function saveJSON(key,val){localStorage.setItem(key,JSON.stringify(val))}
var sessions=loadJSON('db_coach_sessions',[]);
var settings=loadJSON('db_coach_settings',{difficulty:'all',dailyGoal:1,categories:['annuity','life','iul','banking'],mode:'scripted'});
var streak=loadJSON('db_coach_streak',{current:0,longest:0,lastDate:null,practiceDates:[]});

function saveSessions(){saveJSON('db_coach_sessions',sessions)}
function saveSettings(){saveJSON('db_coach_settings',settings)}
function saveStreak(){saveJSON('db_coach_streak',streak)}
function getApiKey(){return localStorage.getItem('db_coach_apikey')||''}
function setApiKey(k){localStorage.setItem('db_coach_apikey',k)}

// ── Sales Framework Phases ──
var PHASES=[
 {name:'Situation',short:'SIT',color:'#3498db',desc:'Understand their current position'},
 {name:'Problem',short:'PROB',color:'#e67e22',desc:'Surface pain points'},
 {name:'Solution',short:'SOL',color:'#1abc9c',desc:'Introduce alternatives naturally'},
 {name:'Consequence',short:'CON',color:'#c0392b',desc:'Cost of inaction'},
 {name:'Commitment',short:'CMT',color:'var(--grn)',desc:'Close with assumptive choice'}
];

// Phase keyword detection
var PHASE_KEYWORDS=[
 // Situation
 ['how long','currently','what rate','what do you typically','how much','tell me about','walk me through','what made you','right now','at the moment','your current','do you have'],
 // Problem Awareness
 ['happy with','feel like','getting ahead','did you know','taxes','taxed','inflation','1099','paying','losing','costing','concerned','worried','frustrat'],
 // Solution Awareness
 ['what if','would it be helpful','would you be interested','tax-deferred','tax deferred','guaranteed','protected','option','alternative','imagine','consider'],
 // Consequence
 ['if you keep','what happens','5 years','10 years','drop back','rates drop','lose','miss','probate','family','without','risk of'],
 // Commitment
 ['does that make sense','would it make sense','would you like','move forward','get started','next step','application','transition','portion','full amount','set up','schedule']
];

// ── Scoring Keywords ──
var OPEN_QUESTION_WORDS=['how','what','tell me','walk me through','describe','explain','can you share','in what way','why do you'];
var EMPATHY_WORDS=['i understand','i hear you','that makes sense','i appreciate','absolutely','of course','great point','good question','completely','fair enough','no pressure','take your time'];
var CLOSE_WORDS=['next step','set up','move forward','get started','application ready','smooth transition','would you like to','schedule','lock in','before it','maturity date','portion','full amount'];

// ── 12 Client Personas ──
var PERSONAS=[
 // CD-to-Annuity
 {id:'margaret',name:'Margaret Chen',age:68,avatar:'&#x1F475;',category:'annuity',difficulty:'easy',
  personality:'agreeable',situation:'Retired teacher with $150K in CDs at 4.5%. Widowed 3 years ago. Lives comfortably but worries about outliving her savings. CD matures in 6 weeks.',
  primaryObjection:'think-about-it',hiddenObjection:'Worried about leaving money to her daughter',
  openTriggers:'When you mention beneficiary protection or probate avoidance',
  resistTriggers:'Feeling pressured or rushed',
  successClose:'Agrees to move $100K to annuity, keep $50K in CD for liquidity'},

 {id:'torres',name:'Robert & Linda Torres',age:72,avatar:'&#x1F468;&#x200D;&#x1F469;&#x200D;&#x1F466;',category:'annuity',difficulty:'medium',
  personality:'analytical',situation:'Married couple, $250K across 3 CDs at different banks. Robert is detail-oriented, wants numbers. Linda\'s mother is in assisted living — Medicaid is a hidden concern.',
  primaryObjection:'cd-rates-good',hiddenObjection:'Worried about Medicaid spend-down for Linda\'s mother\'s care',
  openTriggers:'When you mention FL Medicaid asset protection',
  resistTriggers:'Vague claims without specific numbers',
  successClose:'Moves $150K to annuity for Medicaid protection, keeps $100K liquid'},

 {id:'frank',name:'Frank Kowalski',age:61,avatar:'&#x1F468;',category:'annuity',difficulty:'hard',
  personality:'skeptical',situation:'Self-employed contractor, $200K in CDs. Had a bad experience with a variable annuity 10 years ago — lost money. Very distrustful of insurance products. CD matures in 2 months.',
  primaryObjection:'ties-up-money',hiddenObjection:'Burned by variable annuity before — conflates fixed with variable',
  openTriggers:'When you clearly distinguish fixed from variable annuities',
  resistTriggers:'Any whiff of sales pressure or glossing over risks',
  successClose:'Agrees to start with $50K in a fixed annuity to test it'},

 // Life Insurance
 {id:'sarah',name:'Sarah Mitchell',age:34,avatar:'&#x1F469;',category:'life',difficulty:'easy',
  personality:'emotional',situation:'New mother, 6-month-old baby. Husband is sole income earner ($85K). No life insurance on either of them. Mortgage is $280K. Knows she needs coverage but keeps putting it off.',
  primaryObjection:'afford',hiddenObjection:'Scared of facing mortality — avoids the topic',
  openTriggers:'When you frame it around protecting her baby, not death',
  resistTriggers:'Talking too much about death or worst-case scenarios',
  successClose:'20-year term for both her and husband'},

 {id:'hoffman',name:'James & Diane Hoffman',age:55,avatar:'&#x1F468;&#x200D;&#x1F469;&#x200D;&#x1F466;',category:'life',difficulty:'medium',
  personality:'analytical',situation:'Empty nesters. James has $100K group life through work, retiring in 5 years — coverage ends. Diane has nothing. James had a health scare last year (high blood pressure, managed with meds).',
  primaryObjection:'have-work-coverage',hiddenObjection:'James\'s health scare makes him worry about qualifying',
  openTriggers:'When you explain guaranteed issue options or how managed conditions can still qualify',
  resistTriggers:'Dismissing his work coverage as worthless',
  successClose:'Whole life for James (before health worsens), 20-year term for Diane'},

 {id:'carlos',name:'Carlos Rivera',age:45,avatar:'&#x1F468;',category:'life',difficulty:'hard',
  personality:'skeptical',situation:'Owns a landscaping business, 3 employees. Wife and 2 kids (12, 15). No life insurance, no will. Makes good money ($120K) but thinks insurance is a scam. "I\'m healthy, I don\'t need it."',
  primaryObjection:'dont-need-it',hiddenObjection:'His father died at 52 — he doesn\'t talk about it',
  openTriggers:'When you ask about his kids\' future or business continuation',
  resistTriggers:'Statistics about death or scare tactics',

// ── Objection Response Library ──
var OBJECTIONS={
 'ties-up-money':{label:'Ties up my money',idealResponse:'Reframe: you\'ve been tied up in CDs already, rolling over. Annuity does the same but with tax-deferred growth and a guaranteed floor rate. Plus 10% annual access penalty-free.',keywords:['rolling over','already tied','10%','penalty-free','access','same thing','reframe']},
 'need-money':{label:'Need the money',idealResponse:'10% free withdrawal annually. Many annuities have nursing home/terminal illness waivers for full access. And your CD has early withdrawal penalties too.',keywords:['10%','free withdrawal','waiver','nursing','terminal','penalty','access']},
 'cd-rates-good':{label:'CD rates are good right now',idealResponse:'They are — which is why now is the time to lock in. Rates were 0.5% just 3 years ago. Annuity locks in a guaranteed minimum, so even if market rates drop, your floor is protected.',keywords:['lock in','were 0.5','three years','guaranteed minimum','floor','protected','drop']},
 'surrender':{label:'Don\'t want surrender charges',idealResponse:'CDs have early withdrawal penalties too. The annuity\'s surrender charge decreases every year and disappears after 3-5 years. During that time your money grows tax-deferred — the net benefit outweighs the surrender period.',keywords:['cd','penalty too','decreases','disappears','3-5','tax-deferred','net benefit']},
 'think-about-it':{label:'Need to think about it',idealResponse:'Absolutely. What specifically would you want to think through? That way I can get you the exact information you need. Also — when does your CD mature? I\'d hate for it to auto-renew at whatever rate the bank decides.',keywords:['specifically','what exactly','information','maturity','auto-renew','bank decides','think through']},
 'afford':{label:'Can\'t afford it',idealResponse:'What if it was less than your phone bill? A 20-year term for someone your age can be $25-40/month. That\'s the cost of protecting everything you\'re building for your family.',keywords:['phone bill','$25','$30','$40','per month','cost of','protecting','family','affordable']},
 'dont-need-it':{label:'I\'m healthy, don\'t need it',idealResponse:'That\'s actually the best time to get it — rates are lowest when you\'re healthy. If something changes, you may not qualify or it becomes much more expensive. What would happen to your business and family if you couldn\'t work for 6 months?',keywords:['best time','healthy','rates lowest','qualify','changes','business','family','couldn\'t work']},
 'have-work-coverage':{label:'Have coverage through work',idealResponse:'Group coverage is a great start. But what happens when you retire or change jobs? That coverage doesn\'t follow you. And at 55+, getting new coverage individually will be much more expensive — if you qualify at all.',keywords:['retire','change jobs','doesn\'t follow','individually','expensive','qualify','portable']},
 'fees':{label:'What are the fees?',idealResponse:'Great question. The cost of insurance is built into the policy — there\'s no separate fee statement like a brokerage account. But here\'s what matters: the net returns. After all costs, the tax-free income projections show... And unlike a 401K, you\'re not paying taxes on withdrawals.',keywords:['built in','no separate','net returns','tax-free','income','projections','after all costs']},
 'why-not-index-funds':{label:'Why not just index funds?',idealResponse:'Index funds are great for growth. IUL fills a different gap: tax-free retirement income with downside protection. If the market drops 30%, your IUL floor is 0% — you don\'t lose. It\'s not either/or — it\'s diversification across tax buckets.',keywords:['different gap','tax-free','floor','0%','don\'t lose','diversification','tax bucket','not either','both']},
 'bad-press':{label:'Read bad things about IUL',idealResponse:'There\'s a lot of noise online, and some of it is valid — poorly designed IULs with unrealistic illustrations have hurt people. That\'s why we use conservative assumptions. Let me show you the guaranteed column, not the projected one.',keywords:['valid','poorly designed','conservative','guaranteed column','realistic','honest','not projected','actual']},
 'online-rates':{label:'Online banks pay more',idealResponse:'Some do — and if rate is the only factor, that makes sense. But with $300K, you\'re over the FDIC limit at any single bank. Here we can structure across products to keep everything fully insured. Also, try getting someone on the phone at an online bank when you need something.',keywords:['fdic','limit','$250','over','structure','insured','phone','someone','service']},
 'lock-up-money':{label:'Don\'t want to lock up money',idealResponse:'I hear that. A 12-month CD means your money is only committed for one year, and the rate is significantly better than savings. If something comes up, the early withdrawal penalty is just a few months of interest — not the principal.',keywords:['12 month','one year','committed','better than savings','penalty','few months','interest','principal safe']},
 'higher-rate':{label:'Want the highest rate',idealResponse:'I respect that — rate matters. Let me show you our current CD rates by term. But I also want to mention: if you\'re looking 3-5 years out, a fixed annuity may actually net you more after taxes, since CD interest is taxed annually while annuity growth is deferred.',keywords:['rates','current','term','3-5 years','annuity','net more','after taxes','deferred','taxed annually']}
};

// ── Conversation Trees (Scripted Mode) ──
// Each tree is an array of nodes. Node format:
// {id, phase (0-4), clientMsg, branches:[{trigger:'good'|'okay'|'weak', keywords:[], nextNode, scoreHints:{}}]}
// 'end' as nextNode triggers session end.

function buildTree(persona){
 // Generate a conversation tree based on the persona
 var cat=persona.category;
 var diff=persona.difficulty;
 var obj=OBJECTIONS[persona.primaryObjection]||{};

 // Build a standardized tree structure
 var tree=[];
 var nodeId=0;

 // Opening (Phase 0 - Situation)
 tree.push({id:nodeId++,phase:0,clientMsg:getOpening(persona),branches:[
  {trigger:'good',keywords:['how long','tell me','walk me','what made','currently','how much','what rate'],nextNode:1,scoreHints:{phase:3,question:3,empathy:2}},
  {trigger:'okay',keywords:['cd','annuity','money','savings','interest'],nextNode:1,scoreHints:{phase:2,question:1,empathy:1}},
  {trigger:'weak',keywords:[],nextNode:1,scoreHints:{phase:1,question:0,empathy:0}}
 ]});

 // Situation Response (Phase 0)
 tree.push({id:nodeId++,phase:0,clientMsg:getSituationResponse(persona),branches:[
  {trigger:'good',keywords:['how does that feel','happy with','enough','worried','concerned','getting ahead','inflation','taxes','1099'],nextNode:2,scoreHints:{phase:3,question:3,empathy:2}},
  {trigger:'okay',keywords:['what if','have you considered','there\'s a way','let me tell','better option'],nextNode:2,scoreHints:{phase:1,question:1,empathy:1}},
  {trigger:'weak',keywords:[],nextNode:2,scoreHints:{phase:0,question:0,empathy:0}}
 ]});

 // Problem Awareness (Phase 1)
 tree.push({id:nodeId++,phase:1,clientMsg:getProblemResponse(persona),branches:[
  {trigger:'good',keywords:['what if','imagine','would it help','would you be interested','tax-deferred','guaranteed','protected','alternative'],nextNode:3,scoreHints:{phase:3,question:3,empathy:3}},
  {trigger:'okay',keywords:['annuity','product','option','fixed','rate'],nextNode:3,scoreHints:{phase:2,question:1,empathy:1}},
  {trigger:'weak',keywords:[],nextNode:3,scoreHints:{phase:1,question:0,empathy:0}}
 ]});

 // Solution Awareness (Phase 2)
 tree.push({id:nodeId++,phase:2,clientMsg:getSolutionResponse(persona),branches:[
  {trigger:'good',keywords:['if you keep','what happens','5 years','10 years','drop','rates go down','probate','family','without','risk','lose'],nextNode:4,scoreHints:{phase:4,question:3,empathy:3}},
  {trigger:'okay',keywords:['benefit','advantage','better','compare'],nextNode:4,scoreHints:{phase:2,question:2,empathy:1}},
  {trigger:'weak',keywords:[],nextNode:4,scoreHints:{phase:1,question:0,empathy:0}}
 ]});

 // Objection (Phase 2-3)
 tree.push({id:nodeId++,phase:2,clientMsg:obj.label?'"'+obj.label+'"':'I\'m not sure about this.',branches:[
  {trigger:'good',keywords:obj.keywords||[],nextNode:5,scoreHints:{phase:2,question:2,objection:4,empathy:3}},
  {trigger:'okay',keywords:['understand','hear you','good point','fair'],nextNode:5,scoreHints:{phase:1,question:1,objection:2,empathy:2}},
  {trigger:'weak',keywords:[],nextNode:5,scoreHints:{phase:0,question:0,objection:0,empathy:0}}
 ]});

 // Post-Objection / Consequence (Phase 3)
 tree.push({id:nodeId++,phase:3,clientMsg:getPostObjectionResponse(persona),branches:[
  {trigger:'good',keywords:['does that make sense','would it make sense','would you like','next step','move forward','get started','application','set up','transition','portion','full amount','schedule'],nextNode:6,scoreHints:{phase:3,question:2,empathy:2,close:4}},
  {trigger:'okay',keywords:['think about','consider','look at','option','worth'],nextNode:6,scoreHints:{phase:2,question:1,empathy:1,close:2}},
  {trigger:'weak',keywords:[],nextNode:6,scoreHints:{phase:1,question:0,empathy:0,close:0}}
 ]});

 // Commitment (Phase 4)
 tree.push({id:nodeId++,phase:4,clientMsg:getCommitmentResponse(persona),branches:[
  {trigger:'good',keywords:['great','wonderful','perfect','excellent','set up','schedule','paperwork','next','timeline','maturity','when','ready'],nextNode:'end',scoreHints:{phase:2,question:1,empathy:2,close:4}},
  {trigger:'okay',keywords:['ok','sure','sounds','yes','let\'s'],nextNode:'end',scoreHints:{phase:1,question:0,empathy:1,close:2}},
  {trigger:'weak',keywords:[],nextNode:'end',scoreHints:{phase:0,question:0,empathy:0,close:1}}
 ]});

 return tree;
}

  michael:'Get the paperwork ready. Split it however maximizes coverage and rates. I\'ll sign today if the numbers work. And send everything to my email — I don\'t want paper.'
 };
 return resps[p.id]||'OK, let\'s move forward. What do I need to do?';
}

// ── Active Session State ──
var activeSession=null;
var sessionTimer=null;
var sessionSeconds=0;

function startSession(personaId){
 var persona=PERSONAS.find(function(p){return p.id===personaId});
 if(!persona) return;
 var tree=buildTree(persona);
 activeSession={
  persona:persona,
  mode:settings.mode==='api'&&getApiKey()?'api':'scripted',
  tree:tree,
  currentNode:0,
  transcript:[],
  phaseVisited:[false,false,false,false,false],
  scores:{phase:0,question:0,objection:0,empathy:0,close:0},
  startTime:new Date().toISOString(),
  apiMessages:[]
 };
 sessionSeconds=0;
 sessionTimer=setInterval(function(){sessionSeconds++;renderTimer()},1000);

 // Add initial client message
 var firstMsg=tree[0].clientMsg;
 document.body.classList.add('in-session');
 activeSession.transcript.push({role:'client',text:firstMsg,phase:0});
 if(activeSession.mode==='api'){
  activeSession.apiMessages=[{role:'assistant',content:firstMsg}];
 }
 renderPractice();
 setTimeout(scrollChatBottom,100);
}

function endSession(){
 if(!activeSession) return;
 clearInterval(sessionTimer);
 if(activeSession.mode==='api'){
  scoreSessionAPI();
 } else {
  scoreSessionScripted();
 }
}

function renderTimer(){
 var el=$1('#sessionTimer');
 if(el) el.textContent=fmtTime(sessionSeconds);
}

// ── Scripted Mode Engine ──
function handleAgentMessage(text){
 if(!activeSession||!text.trim()) return;
 activeSession.transcript.push({role:'agent',text:text.trim()});

 // Detect Sales Framework phases from agent's message
 var lower=text.toLowerCase();
 PHASE_KEYWORDS.forEach(function(kws,i){
  kws.forEach(function(kw){
   if(lower.indexOf(kw)>=0) activeSession.phaseVisited[i]=true;
  });
 });

 if(activeSession.mode==='api'){
  handleAPIResponse(text.trim());
  return;
 }

 // Scripted mode: evaluate against current tree node
 var node=activeSession.tree[activeSession.currentNode];
 if(!node){endSession();return}

 var bestBranch=null;
 var bestScore=-1;
 node.branches.forEach(function(b){
  var matches=0;
  b.keywords.forEach(function(kw){
   if(lower.indexOf(kw)>=0) matches++;
  });
  if(matches>bestScore){bestScore=matches;bestBranch=b}
 });

 // Fall back to weakest if no keywords matched
 if(bestScore<=0){
  bestBranch=node.branches[node.branches.length-1];
 }

 // Accumulate scores
 if(bestBranch.scoreHints){
  Object.keys(bestBranch.scoreHints).forEach(function(k){
   activeSession.scores[k]=(activeSession.scores[k]||0)+bestBranch.scoreHints[k];
  });
 }

 // Check for open-ended questions bonus
 OPEN_QUESTION_WORDS.forEach(function(w){
  if(lower.indexOf(w)>=0) activeSession.scores.question=(activeSession.scores.question||0)+0.5;
 });
 // Check empathy bonus
 EMPATHY_WORDS.forEach(function(w){
  if(lower.indexOf(w)>=0) activeSession.scores.empathy=(activeSession.scores.empathy||0)+0.5;
 });
 // Check close language
 CLOSE_WORDS.forEach(function(w){
  if(lower.indexOf(w)>=0) activeSession.scores.close=(activeSession.scores.close||0)+0.5;
 });

 // Show typing indicator then client response
 activeSession.typing=true;
 renderChat();
 var delay=800+Math.random()*1200;
 setTimeout(function(){
  activeSession.typing=false;
  if(bestBranch.nextNode==='end'){
   // Add final client message from commitment
   var commitMsg=getCommitmentResponse(activeSession.persona);
   activeSession.transcript.push({role:'client',text:commitMsg,phase:4});
   activeSession.phaseVisited[4]=true;
   renderChat();
   scrollChatBottom();
   setTimeout(endSession,1000);
  } else {
   var nextNode=activeSession.tree[bestBranch.nextNode];
   if(nextNode){
    activeSession.currentNode=bestBranch.nextNode;
    activeSession.transcript.push({role:'client',text:nextNode.clientMsg,phase:nextNode.phase});
   }
   renderChat();
   scrollChatBottom();
  }
 },delay);

 renderChat();
 scrollChatBottom();
}

// ── Claude API Mode ──
function handleAPIResponse(agentText){
 activeSession.apiMessages.push({role:'user',content:agentText});
 activeSession.typing=true;
 renderChat();
 scrollChatBottom();

 var p=activeSession.persona;
 var systemPrompt='You are playing the role of '+p.name+', a '+p.age+'-year-old '+p.personality+' client in a sales roleplay.\n\n'
  +'BACKGROUND: '+p.situation+'\n\n'
  +'PRIMARY OBJECTION (raise naturally when the topic comes up): '+p.primaryObjection+'\n'
  +'HIDDEN CONCERN: '+p.hiddenObjection+'\n'
  +'YOU OPEN UP WHEN: '+p.openTriggers+'\n'
  +'YOU RESIST WHEN: '+p.resistTriggers+'\n\n'
  +'RULES:\n'
  +'- Stay in character at all times. You are the CLIENT, not the agent.\n'
  +'- Respond naturally in 2-4 sentences. Be conversational, not robotic.\n'
  +'- If the agent follows Sales Framework well (asks good questions, shows empathy, addresses your concerns), gradually become more receptive.\n'
  +'- If the agent is pushy or skips steps, become more resistant.\n'
  +'- When you feel genuinely convinced, agree to: '+p.successClose+'\n'
  +'- If the agent asks for the close and you\'re convinced, agree and end with [SESSION_COMPLETE]\n'
  +'- Never break character or mention Sales Framework, scoring, or that this is practice.';

 fetch('https://api.anthropic.com/v1/messages',{
  method:'POST',
  headers:{
   'Content-Type':'application/json',
   'x-api-key':getApiKey(),
   'anthropic-version':'2023-06-01',
   'anthropic-dangerous-direct-browser-access':'true'
  },
  body:JSON.stringify({
   model:'claude-sonnet-4-20250514',
   max_tokens:300,
   system:systemPrompt,
   messages:activeSession.apiMessages
  })
 }).then(function(r){return r.json()}).then(function(data){
  activeSession.typing=false;
  var reply=(data.content&&data.content[0]&&data.content[0].text)||'...';
  var isComplete=reply.indexOf('[SESSION_COMPLETE]')>=0;
  reply=reply.replace('[SESSION_COMPLETE]','').trim();
  activeSession.apiMessages.push({role:'assistant',content:reply});
  activeSession.transcript.push({role:'client',text:reply});
  renderChat();
  scrollChatBottom();
  if(isComplete) setTimeout(endSession,1500);
 }).catch(function(err){
  activeSession.typing=false;
  activeSession.transcript.push({role:'client',text:'[API Error: '+err.message+'. Ending session.]'});
  renderChat();
  endSession();
 });
}

// ── Scoring ──
function scoreSessionScripted(){
 var s=activeSession.scores;
 // Normalize to 0-20 per category
 var maxPossible={phase:20,question:16,objection:6,empathy:14,close:10};
 var normalized={
  phase:Math.min(20,Math.round((s.phase||0)/maxPossible.phase*20)),
  question:Math.min(20,Math.round((s.question||0)/maxPossible.question*20)),
  objection:Math.min(20,Math.round((s.objection||0)/maxPossible.objection*20)),
  empathy:Math.min(20,Math.round((s.empathy||0)/maxPossible.empathy*20)),
  close:Math.min(20,Math.round((s.close||0)/maxPossible.close*20))
 };
 showScoreModal(normalized,null);
}

function scoreSessionAPI(){
 var transcript=activeSession.transcript.map(function(m){return (m.role==='client'?'CLIENT':'AGENT')+': '+m.text}).join('\n');

 activeSession.typing=true;
 renderChat();

 fetch('https://api.anthropic.com/v1/messages',{
  method:'POST',
  headers:{
   'Content-Type':'application/json',
   'x-api-key':getApiKey(),
   'anthropic-version':'2023-06-01',
   'anthropic-dangerous-direct-browser-access':'true'
  },
  body:JSON.stringify({
   model:'claude-sonnet-4-20250514',
   max_tokens:800,
   messages:[{role:'user',content:'You are an expert Sales Framework sales coach evaluating a practice roleplay transcript.\n\nThe Sales Framework framework has 5 phases:\n1. Situation — understand current position\n2. Problem Awareness — surface pain points\n3. Solution Awareness — introduce alternatives\n4. Consequence — cost of inaction\n5. Commitment — close with assumptive choice\n\nScore the AGENT\'s performance in these 5 categories (0-20 each):\n1. Framework Completion — Did they progress through all 5 phases in order?\n2. Question Quality — Open-ended, client-focused, not leading?\n3. Objection Handling — Addressed concerns effectively?\n4. Empathy & Rapport — Active listening, reflective statements?\n5. Close Technique — Assumptive close, tied to timeline?\n\nReturn ONLY valid JSON in this exact format:\n{"phase":N,"question":N,"objection":N,"empathy":N,"close":N,"feedback":"2-3 sentences of coaching advice"}\n\nTRANSCRIPT:\n'+transcript}]
  })
 }).then(function(r){return r.json()}).then(function(data){
  activeSession.typing=false;
  var txt=(data.content&&data.content[0]&&data.content[0].text)||'{}';
  // Extract JSON from response
  var jsonMatch=txt.match(/\{[\s\S]*\}/);
  if(jsonMatch){
   try{
    var result=JSON.parse(jsonMatch[0]);
    var scores={
     phase:Math.min(20,Math.max(0,result.phase||0)),
     question:Math.min(20,Math.max(0,result.question||0)),
     objection:Math.min(20,Math.max(0,result.objection||0)),
     empathy:Math.min(20,Math.max(0,result.empathy||0)),
     close:Math.min(20,Math.max(0,result.close||0))
    };
    showScoreModal(scores,result.feedback||null);
    return;
   }catch(e){}
  }
  // Fallback to scripted scoring
  scoreSessionScripted();
 }).catch(function(){
  activeSession.typing=false;
  scoreSessionScripted();
 });
}

 $1('#scoreModalContent').innerHTML=h;

function updateStreak(){
 var today=new Date().toISOString().substring(0,10);
 if(!streak.practiceDates) streak.practiceDates=[];
 if(streak.practiceDates.indexOf(today)===-1){
  streak.practiceDates.push(today);
 }
 // Calculate current streak
 var d=new Date();
 var count=0;
 for(var i=0;i<365;i++){
  var ds=d.toISOString().substring(0,10);
  if(streak.practiceDates.indexOf(ds)>=0){
   count++;
   d.setDate(d.getDate()-1);
  } else if(i===0){
   // Today hasn't been practiced yet (but we just added it, so skip)
   d.setDate(d.getDate()-1);
  } else {
   break;
  }
 }
 streak.current=count;
 if(count>streak.longest) streak.longest=count;
 streak.lastDate=today;
 saveStreak();
 renderStreakDisplay();
}

function renderStreakDisplay(){
 var el=$1('#streakDisplay');
 if(el) el.innerHTML=streak.current>0?streak.current+' day'+(streak.current>1?'s':'')+' streak':'';
}

  h+='<span class="badge badge-'+(s.difficulty==='easy'?'grn':s.difficulty==='medium'?'amb':'red')+'" style="font-size:9px">'+s.difficulty+'</span>';
  h+='<span class="badge badge-'+(s.mode==='api'?'grn':'amb')+'" style="font-size:9px">'+s.mode+'</span>';
  h+='</div>';

  // Expandable detail
  h+='<div class="session-detail" id="sd_'+idx+'">';
  // Mini transcript
  h+='<div class="mini-transcript">';
  (s.transcript||[]).forEach(function(m){
   h+='<div><span class="mt-'+(m.role==='client'?'client':'agent')+'">'+(m.role==='client'?s.personaName.split(' ')[0]:'You')+':</span> '+m.text+'</div>';
  });
  h+='</div>';
  // Score bars
  var cats=[{k:'phase',l:'Phase Completion'},{k:'question',l:'Question Quality'},{k:'objection',l:'Objection Handling'},{k:'empathy',l:'Empathy'},{k:'close',l:'Close Technique'}];
  cats.forEach(function(c){
   var v=(s.scores&&s.scores[c.k])||0;
   var bc=v>=15?'var(--grn)':v>=10?'var(--amb)':'var(--red)';
   h+='<div class="score-row"><div class="score-label"><span style="font-size:11px">'+c.l+'</span><span style="font-size:11px;color:'+bc+'">'+v+'/20</span></div>';
   h+='<div class="score-bar"><div class="score-fill" style="width:'+(v/20*100)+'%;background:'+bc+'"></div></div></div>';
  });
  if(s.feedback) h+='<div class="coaching-tip" style="margin-top:8px"><b>Coach:</b> '+s.feedback+'</div>';
  h+='<button class="btn btn-sm btn-red" style="margin-top:8px" onclick="event.stopPropagation();deleteSession('+idx+')">Delete Session</button>';
  h+='</div></div>';
 });

 $1('#p1').innerHTML=h;
}
var histFilter='all';

function toggleSessionDetail(idx){
 var el=$1('#sd_'+idx);
 if(el) el.classList.toggle('show');
}

function deleteSession(idx){
 if(!confirm('Delete this session?')) return;
 sessions.splice(idx,1);
 saveSessions();
 renderHistory();
 showToast('Session deleted');
}

// ── Stats Tab ──
function renderStats(){
 var h='';

 if(sessions.length===0){
  h+='<div class="card" style="text-align:center;color:var(--muted)">Complete your first practice session to see stats!</div>';
  $1('#p2').innerHTML=h;
  return;
 }

 // Summary cards
 var totalSessions=sessions.length;
 var avgScore=Math.round(sessions.reduce(function(s,x){return s+x.total},0)/totalSessions);
 var bestSession=sessions.reduce(function(best,s){return s.total>best.total?s:best},sessions[0]);

 // This week count
 var weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-7);
 var thisWeek=sessions.filter(function(s){return new Date(s.date)>=weekAgo}).length;

 h+='<div class="stat-grid">';
 h+='<div class="stat-card"><div class="num">'+totalSessions+'</div><div class="lbl">Sessions</div><div class="sub">'+thisWeek+' this week</div></div>';
 h+='<div class="stat-card grn"><div class="num">'+avgScore+'</div><div class="lbl">Avg Score</div></div>';
 h+='<div class="stat-card amb"><div class="num">'+streak.current+'</div><div class="lbl">Day Streak</div><div class="sub">Best: '+streak.longest+'</div></div>';
 h+='<div class="stat-card"><div class="num">'+bestSession.total+'</div><div class="lbl">Best Score</div><div class="sub">'+bestSession.personaName+'</div></div>';
 h+='</div>';

 // Bar chart - last 14 sessions
 var recent=sessions.slice(0,14).reverse();
 h+='<div class="card"><h3>Recent Sessions</h3>';
 h+='<div class="bar-chart">';
 recent.forEach(function(s){
  var pct=s.total;
  var color=s.total>=80?'var(--grn)':s.total>=60?'var(--amb)':'var(--red)';
  h+='<div class="bar-col">';
  h+='<div class="bar-score" style="color:'+color+'">'+s.total+'</div>';
  h+='<div class="bar-fill" style="height:'+pct+'%;background:'+color+'"></div>';
  h+='<div class="bar-date">'+fmtDateShort(s.date)+'</div>';
  h+='</div>';
 });
 h+='</div></div>';

 // Category breakdown
 h+='<div class="card"><h3>By Category</h3>';
 var catNames={annuity:'CD-to-Annuity',life:'Life Insurance',iul:'IUL',banking:'Banking/CD'};
 var catColors={annuity:'var(--grn)',life:'var(--red)',iul:'var(--amb)',banking:'var(--pri)'};
 ['annuity','life','iul','banking'].forEach(function(cat){
  var catSessions=sessions.filter(function(s){return s.category===cat});
  if(catSessions.length===0) return;
  var avg=Math.round(catSessions.reduce(function(s,x){return s+x.total},0)/catSessions.length);
  var color=avg>=80?'var(--grn)':avg>=60?'var(--amb)':'var(--red)';
  h+='<div style="margin-bottom:10px">';
  h+='<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:3px"><span>'+catNames[cat]+' ('+catSessions.length+')</span><span style="color:'+color+'">Avg: '+avg+'</span></div>';
  h+='<div class="score-bar"><div class="score-fill" style="width:'+avg+'%;background:'+color+'"></div></div>';
  h+='</div>';
 });
 h+='</div>';

 // Weakest area
 var dimTotals={phase:0,question:0,objection:0,empathy:0,close:0};
 sessions.forEach(function(s){
  if(!s.scores) return;
  Object.keys(dimTotals).forEach(function(k){dimTotals[k]+=(s.scores[k]||0)});
 });
 var dimAvgs={};
 Object.keys(dimTotals).forEach(function(k){dimAvgs[k]=Math.round(dimTotals[k]/totalSessions*10)/10});
 var weakestKey=Object.keys(dimAvgs).reduce(function(a,b){return dimAvgs[a]<dimAvgs[b]?a:b});
 var dimLabels={phase:'Framework Completion',question:'Question Quality',objection:'Objection Handling',empathy:'Empathy & Rapport',close:'Close Technique'};
 var dimTips={
  phase:'Practice asking situation questions before introducing solutions. Follow the 5-phase order.',
  question:'Use more open-ended questions: "How does that feel?", "What concerns you most?", "Tell me about..."',
  objection:'When they object, acknowledge first ("I hear you"), then reframe. Review the objection scripts.',
  empathy:'Add reflective statements: "It sounds like...", "I can see why that matters", "That makes sense."',
  close:'Tie your close to their timeline. "Your CD matures on the 15th \u2014 shall we have paperwork ready?"'
 };

 h+='<div class="card"><h3>Focus Area</h3>';
 h+='<div style="text-align:center;margin-bottom:12px">';
 h+='<div style="font-size:11px;color:var(--muted)">Your weakest dimension</div>';
 h+='<div style="font-size:16px;font-weight:700;color:var(--red)">'+dimLabels[weakestKey]+' ('+dimAvgs[weakestKey].toFixed(1)+'/20 avg)</div>';
 h+='</div>';
 h+='<div class="coaching-tip"><b>Tip:</b> '+dimTips[weakestKey]+'</div>';

 // All dimensions
 h+='<div style="margin-top:12px">';
 Object.keys(dimAvgs).forEach(function(k){
  var v=dimAvgs[k];
  var pct=(v/20)*100;
  var c=v>=15?'var(--grn)':v>=10?'var(--amb)':'var(--red)';
  h+='<div class="score-row"><div class="score-label"><span style="font-size:11px">'+dimLabels[k]+'</span><span style="font-size:11px;color:'+c+'">'+v.toFixed(1)+'</span></div>';
  h+='<div class="score-bar"><div class="score-fill" style="width:'+pct+'%;background:'+c+'"></div></div></div>';
 });
 h+='</div></div>';

 // Streak calendar
 h+='<div class="card"><h3>Practice Calendar (30 Days)</h3>';
 h+='<div class="day-labels"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>';
 h+='<div class="streak-cal">';
 var today=new Date();
 var todayStr=today.toISOString().substring(0,10);
 // Start from 29 days ago, find first Sunday
 var start=new Date();start.setDate(start.getDate()-29);
 while(start.getDay()!==0) start.setDate(start.getDate()-1);
 var end=new Date();end.setDate(end.getDate()+6-end.getDay());// End on Saturday

 var d=new Date(start);
 while(d<=end){
  var ds=d.toISOString().substring(0,10);
  var practiced=streak.practiceDates&&streak.practiceDates.indexOf(ds)>=0;
  var isToday=ds===todayStr;
  var isFuture=d>today;
  h+='<div class="streak-day'+(practiced?' active':'')+(isToday?' today':'')+'" style="'+(isFuture?'opacity:.3':'')+'" title="'+ds+'"></div>';
  d.setDate(d.getDate()+1);
 }
 h+='</div></div>';

 $1('#p2').innerHTML=h;
}

// ── Settings Tab ──

 // API Key

 h+='<div style="display:flex;gap:6px"><input type="password" id="apiKeyInput" value="'+(getApiKey()||'')+'" placeholder="sk-ant-...">';
 h+='<button class="btn btn-sm btn-pri" onclick="saveApiKey()">Save</button>';
 h+='<button class="btn btn-sm btn-outline" onclick="testApiKey()">Test</button></div>';
 h+='<div style="font-size:10px;color:var(--muted);margin-top:4px">Enables Claude AI client mode. Costs ~$0.01-0.03 per session. Key stays in your browser only.</div>';

 // Preferences
 h+='<div class="card"><h3>Practice Preferences</h3>';

 h+='<select id="prefDifficulty" onchange="settings.difficulty=this.value;saveSettings()">';
 h+='<option value="all"'+(settings.difficulty==='all'?' selected':'')+'>All (Random)</option>';
 h+='<option value="easy"'+(settings.difficulty==='easy'?' selected':'')+'>Easy</option>';
 h+='<option value="medium"'+(settings.difficulty==='medium'?' selected':'')+'>Medium</option>';
 h+='<option value="hard"'+(settings.difficulty==='hard'?' selected':'')+'>Hard</option>';
 h+='</select></div>';

 h+='<div class="form-group"><label>Daily Session Goal</label>';

 h+='<div class="form-group"><label>Default Mode</label>';

 h+='<option value="api"'+(settings.mode==='api'?' selected':'')+'>Claude API</option>';
 h+='</select></div>';
 h+='</div>';

 // Data
 h+='<div class="card"><h3>Data Management</h3>';
 h+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
 h+='<button class="btn btn-sm btn-outline" onclick="exportData()">Export History</button>';
 h+='<button class="btn btn-sm btn-outline" onclick="resetStreak()">Reset Streak</button>';
 h+='<button class="btn btn-sm btn-red" onclick="clearAllData()">Clear All Data</button>';
 h+='</div>';
 var bytes=JSON.stringify(sessions).length+JSON.stringify(settings).length+JSON.stringify(streak).length;
 h+='<div style="font-size:10px;color:var(--muted);margin-top:8px">Storage: '+(bytes/1024).toFixed(1)+' KB used</div>';
 h+='</div>';

 // About
 h+='<div class="card"><h3>About Scoring</h3>';
 h+='<div style="font-size:12px;line-height:1.6;color:var(--muted)">';

 h+='<b>5 Scoring Categories (20 pts each, 100 total):</b><br>';
 h+='1. <b>Phase Completion</b> \u2014 Did you follow all 5 phases in order?<br>';
 h+='2. <b>Question Quality</b> \u2014 Open-ended, client-focused questions?<br>';
 h+='3. <b>Objection Handling</b> \u2014 Acknowledged and reframed concerns?<br>';
 h+='4. <b>Empathy & Rapport</b> \u2014 Active listening, reflective statements?<br>';
 h+='5. <b>Close Technique</b> \u2014 Assumptive close tied to their timeline?<br><br>';
 h+='<b>Scripted mode</b> uses keyword matching \u2014 good for building habits.<br>';
 h+='<b>Claude API mode</b> provides dynamic responses and detailed coaching feedback.';
 h+='</div></div>';

 $1('#p3').innerHTML=h;
}

function saveApiKey(){
 var key=($1('#apiKeyInput')||{}).value||'';
 setApiKey(key.trim());
 showToast(key?'API key saved':'API key cleared');
 renderSettings();
}

function testApiKey(){
 var key=getApiKey();
 if(!key){showToast('No API key configured');return}
 showToast('Testing connection...');
 fetch('https://api.anthropic.com/v1/messages',{
  method:'POST',
  headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:10,messages:[{role:'user',content:'Hi'}]})
 }).then(function(r){
  var dot=$1('#apiStatusDot');
  if(r.ok){
   if(dot){dot.className='api-status ok'}
   showToast('API connection successful!');
  } else {
   if(dot){dot.className='api-status err'}
   showToast('API error: '+r.status);
  }
 }).catch(function(e){
  var dot=$1('#apiStatusDot');
  if(dot){dot.className='api-status err'}
  showToast('Connection failed: '+e.message);
 });
}

function exportData(){
 var data=JSON.stringify({sessions:sessions,settings:settings,streak:streak},null,2);
 var blob=new Blob([data],{type:'application/json'});
 var a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='DuetCoach_export_'+new Date().toISOString().substring(0,10)+'.json';
 a.click();
 showToast('Data exported!');
}

function resetStreak(){
 if(!confirm('Reset your streak? This cannot be undone.')) return;
 streak.current=0;streak.longest=0;streak.practiceDates=[];
 saveStreak();
 renderStats();
 renderStreakDisplay();
 showToast('Streak reset');
}

function clearAllData(){
 if(!confirm('Delete ALL practice data? This cannot be undone.')) return;
 sessions=[];streak={current:0,longest:0,lastDate:null,practiceDates:[]};
 saveSessions();saveStreak();
 renderStreakDisplay();
 showTab(currentTab);
 showToast('All data cleared');
}

// ── Init ──
renderStreakDisplay();
renderPractice();
</script>
